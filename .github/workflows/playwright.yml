name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
  - cron: "0 5 * * Mon"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --user root
    env:
      HOME: /root

    steps:
      - uses: actions/checkout@v4

      # ⭐ Download previous Allure history from gh-pages
      - name: Download previous Allure history
        if: always()
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/${{ github.repository }}.git gh-pages
          if [ -d "gh-pages/allure-report/history" ]; then
            echo "Found previous history"
            mkdir -p allure-results/history
            cp -R gh-pages/allure-report/history/* allure-results/history/
          else
            echo "No previous history found in gh-pages"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Create Allure executor.json
        if: always()
        run: |
          mkdir -p allure-results
          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${{ github.repository }}/actions",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/",
            "reportName": "Allure Report"
          }
          EOF

      - name: Create Allure environment.properties
        if: always()
        run: |
          mkdir -p allure-results
          echo "OS=Ubuntu Linux" >> allure-results/environment.properties
          echo "Node=$(node -v)" >> allure-results/environment.properties
          echo "Playwright=$(npx playwright --version)" >> allure-results/environment.properties
          echo "Repository=${{ github.repository }}" >> allure-results/environment.properties
          echo "Run ID=${{ github.run_id }}" >> allure-results/environment.properties

      - name: Install Java
        if: always()
        run: |
         apt-get update
         apt-get install -y default-jre

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline --save-dev

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Create root redirect index.html
        if: always()
        run: |
          mkdir -p gh-pages-root
          cat <<EOF > gh-pages-root/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <title>Redirecting to Allure Report</title>
              <meta http-equiv="refresh" content="0; url=allure-report/" />
              <link rel="canonical" href="allure-report/" />
            </head>
            <body>
              <p>Redirecting to <a href="allure-report/">Allure Report</a>...</p>
            </body>
          </html>
          EOF

      - name: Commit Allure report to gh-pages
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git gh-pages-commit

          mkdir -p gh-pages-commit/allure-report/history
          cp -R allure-report/* gh-pages-commit/allure-report/
          cp -R gh-pages-root/index.html gh-pages-commit/index.html

          cd gh-pages-commit

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Update Allure history for run ${{ github.run_number }}" || echo "No changes to commit"
          git push origin gh-pages

      - name: Upload Allure Report to GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/allure-report

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
