name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - name: Debug allure-results
      if: always()
      run: |
        echo "=== CONTENT OF allure-results ==="
        ls -R allure-results || echo "NO allure-results FOUND"

    - name: Debug allure-report
      if: always()
      run: |
        echo "=== CONTENT OF allure-report ==="
        ls -R allure-report || echo "NO allure-report FOUND"


    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Generate Allure Report
      if: always()
      run: npx allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report to GitHub Pages
      if: always()
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
